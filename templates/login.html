{% extends "base.html" %}
{% block title %}Connexion — Nim{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-size:3rem;margin-bottom:0.5rem;">🎮</div>
      <h1 style="font-size:2rem;font-weight:800;color:var(--accent2);">Game</h1>
      <p style="color:var(--muted);margin-top:0.3rem;">Multijoueur en réseau local</p>
    </div>
    <div class="card">
      <div class="card-title">Connexion</div>
      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label>Pseudo</label>
          <input type="text" name="username" required autofocus autocomplete="off">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.7rem;">Se connecter</button>
      </form>
      <p style="text-align:center;margin-top:1rem;color:var(--muted);font-size:0.9rem;">
        Pas encore de compte ? <a href="/register" style="color:var(--accent2);">S'inscrire</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
