<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nim Game{% endblock %}</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #242433;
      --border: #2e2e42;
      --accent: #e53e3e;
      --accent2: #f6ad55;
      --green: #48bb78;
      --blue: #63b3ed;
      --text: #e2e8f0;
      --muted: #718096;
      --match-wood: #d4a856;
      --match-tip: #e53e3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .nav-brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: 1px;
    }
    .nav-brand span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { color: var(--muted); font-size: 0.9rem; }
    .nav-user strong { color: var(--text); }
    .btn {
      display: inline-block;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #c53030; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-green { background: var(--green); color: #1a1a24; }
    .btn-green:hover { background: #38a169; }
    .btn-blue { background: var(--blue); color: #1a1a24; }
    .btn-blue:hover { background: #4299e1; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent2);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
    }
    input[type=text], input[type=password] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-size: 1rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent2); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: var(--muted); font-size: 0.9rem; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-error { background: #2d1515; border: 1px solid #c53030; color: #feb2b2; }
    .alert-success { background: #1a2e1f; border: 1px solid #38a169; color: #9ae6b4; }
    .alert-info { background: #1a2240; border: 1px solid #4299e1; color: #bee3f8; }
    /* Toast notifications */
    #toast-container {
      position: fixed;
      top: 70px;
      right: 1rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      animation: slideIn 0.3s ease;
      max-width: 320px;
    }
    .toast-error { background: #c53030; color: white; }
    .toast-success { background: var(--green); color: #1a1a24; }
    .toast-info { background: var(--blue); color: #1a1a24; }
    @keyframes slideIn {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .modal h2 { margin-bottom: 0.5rem; }
    .modal p { color: var(--muted); margin-bottom: 1.5rem; }
    .modal-actions { display: flex; gap: 1rem; justify-content: center; }
  </style>
</head>
<body>
  {% if session.username %}
  <nav>
    <div class="nav-brand">🎮 <span>G</span>ame</div>
    <div class="nav-right">
      <span class="nav-user">Connecté en tant que <strong>{{ session.username }}</strong></span>
      <a href="/logout" class="btn btn-ghost btn-sm">Déconnexion</a>
    </div>
  </nav>
  {% endif %}

  <div id="toast-container"></div>

  {% block content %}{% endblock %}

  <script>
    function showToast(msg, type='info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
